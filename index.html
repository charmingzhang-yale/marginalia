
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冷月无声 | 个人札记</title>

  <style>
    /* ===== 颜色设置 ===== */
    :root {
      --paper: #F5F1E7;
      --ink: #493F35;
      --muted: #877966;
      --accent: #A88962;
      --green: #3D4943;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    /* ===== 全站字体与背景 ===== */
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC",
                   "Noto Sans CJK SC", "Noto Sans SC",
                   sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.85;
    }

    /* ===== 顶部标题区域 ===== */
    header {
      background: var(--green);
      color: #F5EEE0;
      text-align: center;
      padding: 72px 20px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 500;
      letter-spacing: 0.10em;
      margin: 12px 0;
    }

    header p {
      margin: 6px 0;
    }

    header small {
      color: #C9B58C;
    }

    /* ===== 导航栏 ===== */
    nav {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #D8CDBB;
    }

    nav a {
      display: inline-block;
      margin: 0 16px;
      color: var(--ink);
      text-decoration: none;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* ===== 链接 ===== */
    a {
      color: #806044;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== 主体布局 ===== */
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 28px 60px;
    }

    section {
      margin: 38px 0;
      scroll-margin-top: 20px;
    }

    /* ===== 栏目标题 ===== */
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      border-bottom: 1px solid #D8CDBB;
      padding-bottom: 10px;
      margin-bottom: 22px;
    }

    /* ===== 文章列表 ===== */
    article {
      padding: 12px 0 20px;
      border-bottom: 1px solid #E1D8CA;
    }

    article h3 {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.6;
      margin: 4px 0 10px;
    }

    article p {
      line-height: 1.9;
      margin: 10px 0;
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ===== 页脚 ===== */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 25px;
    }

    /* ===== 手机端适配 ===== */
    @media (max-width: 600px) {
      body {
        font-size: 16px;
      }

      header {
        padding: 55px 20px;
      }

      header h1 {
        font-size: 2rem;
      }

      nav {
        padding: 16px 10px;
      }

      nav a {
        margin: 0 12px;
      }

      main {
        padding: 20px 20px 45px;
      }

      section {
        margin: 30px 0;
      }

      h2 {
        font-size: 1.25rem;
      }

      article h3 {
        font-size: 1.05rem;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 网站标题 ===== -->
  <header>
    <small>PERSONAL NOTES</small>
    <h1>冷月无声</h1>
    <p>读史 · 写诗 · 看球</p>
    <small>一些旧人旧事，一点闲言碎语。</small>
  </header>

  <!-- ===== 导航栏 ===== -->
  <nav>
    <a href="#about">关于</a>
    <a href="#history">读史</a>
  </nav>

  <!-- ===== 正文 ===== -->
  <main>

    <!-- 关于这里 -->
    <section id="about">
      <h2>关于这里</h2>
      <p>
        喜欢魏晋南北朝，偶尔写诗，
        也看足球和篮球。
        这里记录读书时的意外发现，
        以及一些值得记住的人与故事。
      </p>
    </section>

    <!-- 读史札记 -->
    <section id="history">
      <h2>读史札记</h2>

      <article>
        <div class="meta">南齐 · 读史随笔</div>
        <h3>南齐有自己的《再见爱人》</h3>
        <p>
          读到《遗萧道成书》和《报沈攸之书》，
          突然觉得，南齐有自己的《再见爱人》
          和《后会有期》——再也不见。
        </p>
      </article>

      <article>
        <div class="meta">南齐 · 史书弹幕</div>
        <h3>萧鸾：朕还要管你们争功？</h3>
        <p>
          崔恭祖因为争功扬言刺杀左兴盛，
          最后居然还要皇帝亲自出面协调。
        </p>
      </article>

    </section>

  </main>

  <!-- ===== 页脚 ===== -->
  <footer>
    冷月无声 · 随兴而记
  </footer>

</body>
</html>
